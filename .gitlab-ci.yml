stages:
  - test
  - verify
  - finalize

test-python:
  id_tokens:
    SITE_ID_TOKEN:
      aud: "https://gitlab.jsc.fz-juelich.de"
  stage: test
  tags:
    - jureca
    - jacamar
    - login
    - shell
  script:
    - python3 main.py
    - 'echo "GitHub commit SHA: ${GITHUB_COMMIT_SHA}"'
    - 'echo "GitHub repository: ${GITHUB_REPOSITORY}"'
    - 'echo "GitHub run ID: ${GITHUB_RUN_ID}"'

test-additional-success:
  id_tokens:
    SITE_ID_TOKEN:
      aud: "https://gitlab.jsc.fz-juelich.de"
  stage: test
  tags:
    - jureca
    - jacamar
    - login
    - shell
  allow_failure: false
  script:
    - 'echo "ClusterHop live test 7: Additional test passed"'

verify-results:
  id_tokens:
    SITE_ID_TOKEN:
      aud: "https://gitlab.jsc.fz-juelich.de"
  stage: verify
  tags:
    - jureca
    - jacamar
    - login
    - shell
  needs:
    - job: test-python
    - job: test-additional-success
  allow_failure: false
  script:
    - 'echo "ClusterHop live test 8: Intermediate verification failure"'
    - exit 1

finalize-results:
  id_tokens:
    SITE_ID_TOKEN:
      aud: "https://gitlab.jsc.fz-juelich.de"
  stage: finalize
  tags:
    - jureca
    - jacamar
    - login
    - shell
  needs:
    - job: verify-results
  allow_failure: false
  script:
    - 'echo "ClusterHop live test 7: Final stage succeeded"'
