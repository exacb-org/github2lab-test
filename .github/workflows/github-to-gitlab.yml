name: GitHub to GitLab Test

on:
  push:
    branches:
      - main

jobs:
  send-to-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show current commit ID
        run: git rev-parse HEAD

      - name: Push commit to GitLab CI branch
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          CI_BRANCH="ci/${GITHUB_SHA}"
          GITLAB_URL="https://oauth2:${GITLAB_TOKEN}@gitlab.jsc.fz-juelich.de/exacb/fahmin-experiments/githubci/github2lab-test.git"

          git remote add gitlab "$GITLAB_URL"
          git push gitlab "HEAD:refs/heads/${CI_BRANCH}"

      - name: Wait for GitLab pipeline creation
        id: gitlab-pipeline
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          ENCODED_PROJECT_PATH="exacb%2Ffahmin-experiments%2Fgithubci%2Fgithub2lab-test"
          CI_BRANCH="ci/${GITHUB_SHA}"

          echo "Waiting for GitLab pipeline for branch: ${CI_BRANCH}"

          for attempt in {1..10}; do
            RESPONSE=$(curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              "https://gitlab.jsc.fz-juelich.de/api/v4/projects/${ENCODED_PROJECT_PATH}/pipelines?ref=${CI_BRANCH}")

            PIPELINE_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')
            PIPELINE_URL=$(echo "$RESPONSE" | jq -r '.[0].web_url // empty')

            if [ -n "$PIPELINE_ID" ]; then
              echo "Found GitLab pipeline ID: ${PIPELINE_ID}"
              echo "GitLab pipeline URL: ${PIPELINE_URL}"

              echo "pipeline_id=${PIPELINE_ID}" >> "$GITHUB_OUTPUT"
              echo "pipeline_url=${PIPELINE_URL}" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            echo "Pipeline not created yet. Attempt ${attempt}/10"
            sleep 5
          done

          echo "GitLab pipeline was not found."
          exit 1

      - name: Wait for GitLab pipeline result
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          PIPELINE_ID: ${{ steps.gitlab-pipeline.outputs.pipeline_id }}
        run: |
          ENCODED_PROJECT_PATH="exacb%2Ffahmin-experiments%2Fgithubci%2Fgithub2lab-test"

          echo "Waiting for GitLab pipeline ${PIPELINE_ID} to finish"

          for attempt in {1..30}; do
            RESPONSE=$(curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              "https://gitlab.jsc.fz-juelich.de/api/v4/projects/${ENCODED_PROJECT_PATH}/pipelines/${PIPELINE_ID}")

            PIPELINE_STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Current GitLab pipeline status: ${PIPELINE_STATUS}"

            if [ "$PIPELINE_STATUS" = "success" ]; then
              echo "GitLab pipeline passed."
              exit 0
            fi

            if [ "$PIPELINE_STATUS" = "failed" ] || \
               [ "$PIPELINE_STATUS" = "canceled" ] || \
               [ "$PIPELINE_STATUS" = "skipped" ]; then
              echo "GitLab pipeline finished with status: ${PIPELINE_STATUS}"
              exit 1
            fi

            echo "Pipeline is still running. Attempt ${attempt}/30"
            sleep 5
          done

          echo "Timed out while waiting for GitLab pipeline."
          exit 1

      - name: Get GitLab pipeline jobs
        id: gitlab-jobs
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          PIPELINE_ID: ${{ steps.gitlab-pipeline.outputs.pipeline_id }}
        run: |
          ENCODED_PROJECT_PATH="exacb%2Ffahmin-experiments%2Fgithubci%2Fgithub2lab-test"

          JOBS_RESPONSE=$(curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.jsc.fz-juelich.de/api/v4/projects/${ENCODED_PROJECT_PATH}/pipelines/${PIPELINE_ID}/jobs")

          echo "$JOBS_RESPONSE" | jq .

          MAIN_JOB_ID=$(echo "$JOBS_RESPONSE" | jq -r '.[0].id // empty')
          MAIN_JOB_NAME=$(echo "$JOBS_RESPONSE" | jq -r '.[0].name // empty')
          MAIN_JOB_URL=$(echo "$JOBS_RESPONSE" | jq -r '.[0].web_url // empty')

          if [ -z "$MAIN_JOB_ID" ]; then
            echo "No GitLab jobs were found."
            exit 1
          fi

          echo "Main GitLab job ID: ${MAIN_JOB_ID}"
          echo "Main GitLab job name: ${MAIN_JOB_NAME}"
          echo "Main GitLab job URL: ${MAIN_JOB_URL}"

          echo "main_job_id=${MAIN_JOB_ID}" >> "$GITHUB_OUTPUT"
          echo "main_job_name=${MAIN_JOB_NAME}" >> "$GITHUB_OUTPUT"
          echo "main_job_url=${MAIN_JOB_URL}" >> "$GITHUB_OUTPUT"

      - name: Get main GitLab job log
        id: gitlab-job-log
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          MAIN_JOB_ID: ${{ steps.gitlab-jobs.outputs.main_job_id }}
        run: |
          ENCODED_PROJECT_PATH="exacb%2Ffahmin-experiments%2Fgithubci%2Fgithub2lab-test"

          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.jsc.fz-juelich.de/api/v4/projects/${ENCODED_PROJECT_PATH}/jobs/${MAIN_JOB_ID}/trace" \
            --output gitlab-job.log

          echo "Main GitLab job log:"
          cat gitlab-job.log