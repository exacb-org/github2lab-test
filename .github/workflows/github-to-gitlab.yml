name: GitHub to GitLab Test

on:
  push:
    branches:
      - main

jobs:
  send-to-gitlab:
    runs-on: ubuntu-latest

    steps:

      - name: Download GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Show current commit ID
        run: git rev-parse HEAD


      - name: Push commit to GitLab CI branch
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          CI_BRANCH="ci/${GITHUB_SHA}"
          GITLAB_URL="https://oauth2:${GITLAB_TOKEN}@gitlab.jsc.fz-juelich.de/exacb/fahmin-experiments/githubci/github2lab-test.git"

          git remote add gitlab "$GITLAB_URL"
          git push gitlab "HEAD:refs/heads/${CI_BRANCH}"


      - name: Wait for GitLab pipeline creation
        id: gitlab-pipeline
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          ENCODED_PROJECT_PATH="exacb%2Ffahmin-experiments%2Fgithubci%2Fgithub2lab-test"
          CI_BRANCH="ci/${GITHUB_SHA}"

          echo "Waiting for GitLab pipeline for branch: ${CI_BRANCH}"

          for attempt in {1..10}; do
            RESPONSE=$(curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              "https://gitlab.jsc.fz-juelich.de/api/v4/projects/${ENCODED_PROJECT_PATH}/pipelines?ref=${CI_BRANCH}")

            PIPELINE_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')
            PIPELINE_URL=$(echo "$RESPONSE" | jq -r '.[0].web_url // empty')

            if [ -n "$PIPELINE_ID" ]; then
              echo "Found GitLab pipeline ID: ${PIPELINE_ID}"
              echo "GitLab pipeline URL: ${PIPELINE_URL}"

              echo "pipeline_id=${PIPELINE_ID}" >> "$GITHUB_OUTPUT"
              echo "pipeline_url=${PIPELINE_URL}" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            echo "Pipeline not created yet. Attempt ${attempt}/10"
            sleep 5
          done

          echo "GitLab pipeline was not found."
          exit 1


      - name: Wait for GitLab pipeline result
        id: gitlab-result
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          PIPELINE_ID: ${{ steps.gitlab-pipeline.outputs.pipeline_id }}
        run: |
          ENCODED_PROJECT_PATH="exacb%2Ffahmin-experiments%2Fgithubci%2Fgithub2lab-test"

          echo "Waiting for GitLab pipeline ${PIPELINE_ID} to finish"

          for attempt in {1..30}; do
            RESPONSE=$(curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              "https://gitlab.jsc.fz-juelich.de/api/v4/projects/${ENCODED_PROJECT_PATH}/pipelines/${PIPELINE_ID}")

            PIPELINE_STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Current GitLab pipeline status: ${PIPELINE_STATUS}"

            if [ "$PIPELINE_STATUS" = "success" ] || \
               [ "$PIPELINE_STATUS" = "failed" ] || \
               [ "$PIPELINE_STATUS" = "canceled" ] || \
               [ "$PIPELINE_STATUS" = "skipped" ]; then

              echo "GitLab pipeline finished with status: ${PIPELINE_STATUS}"
              echo "pipeline_status=${PIPELINE_STATUS}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Pipeline is still running. Attempt ${attempt}/30"
            sleep 5
          done

          echo "GitLab pipeline timed out."
          echo "pipeline_status=timeout" >> "$GITHUB_OUTPUT"
          exit 0


      - name: Get GitLab pipeline jobs
        id: gitlab-jobs
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          PIPELINE_ID: ${{ steps.gitlab-pipeline.outputs.pipeline_id }}
        run: |
          ENCODED_PROJECT_PATH="exacb%2Ffahmin-experiments%2Fgithubci%2Fgithub2lab-test"

          JOBS_RESPONSE=$(curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.jsc.fz-juelich.de/api/v4/projects/${ENCODED_PROJECT_PATH}/pipelines/${PIPELINE_ID}/jobs")

          JOB_COUNT=$(echo "$JOBS_RESPONSE" | jq 'length')

          echo "GitLab jobs found: ${JOB_COUNT}"

          if [ "$JOB_COUNT" -eq 0 ]; then
            echo "No GitLab jobs were found for this pipeline."

            echo "job_count=0" >> "$GITHUB_OUTPUT"
            echo "main_job_id=" >> "$GITHUB_OUTPUT"
            echo "main_job_name=No job available" >> "$GITHUB_OUTPUT"
            echo "main_job_status=not_available" >> "$GITHUB_OUTPUT"
            echo "main_job_stage=not_available" >> "$GITHUB_OUTPUT"
            echo "main_job_duration=not_available" >> "$GITHUB_OUTPUT"
            echo "main_job_url=" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          MAIN_JOB_ID=$(echo "$JOBS_RESPONSE" | jq -r '.[0].id')
          MAIN_JOB_NAME=$(echo "$JOBS_RESPONSE" | jq -r '.[0].name')
          MAIN_JOB_STATUS=$(echo "$JOBS_RESPONSE" | jq -r '.[0].status')
          MAIN_JOB_STAGE=$(echo "$JOBS_RESPONSE" | jq -r '.[0].stage')
          MAIN_JOB_DURATION=$(echo "$JOBS_RESPONSE" | jq -r '.[0].duration // "not_available"')
          MAIN_JOB_URL=$(echo "$JOBS_RESPONSE" | jq -r '.[0].web_url')

          echo "Main GitLab job ID: ${MAIN_JOB_ID}"
          echo "Main GitLab job name: ${MAIN_JOB_NAME}"
          echo "Main GitLab job status: ${MAIN_JOB_STATUS}"
          echo "Main GitLab job stage: ${MAIN_JOB_STAGE}"
          echo "Main GitLab job duration: ${MAIN_JOB_DURATION}"
          echo "Main GitLab job URL: ${MAIN_JOB_URL}"

          echo "job_count=${JOB_COUNT}" >> "$GITHUB_OUTPUT"
          echo "main_job_id=${MAIN_JOB_ID}" >> "$GITHUB_OUTPUT"
          echo "main_job_name=${MAIN_JOB_NAME}" >> "$GITHUB_OUTPUT"
          echo "main_job_status=${MAIN_JOB_STATUS}" >> "$GITHUB_OUTPUT"
          echo "main_job_stage=${MAIN_JOB_STAGE}" >> "$GITHUB_OUTPUT"
          echo "main_job_duration=${MAIN_JOB_DURATION}" >> "$GITHUB_OUTPUT"
          echo "main_job_url=${MAIN_JOB_URL}" >> "$GITHUB_OUTPUT"


      - name: Get main GitLab job log
        id: gitlab-job-log
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          MAIN_JOB_ID: ${{ steps.gitlab-jobs.outputs.main_job_id }}
        run: |
          ENCODED_PROJECT_PATH="exacb%2Ffahmin-experiments%2Fgithubci%2Fgithub2lab-test"

          if [ -z "$MAIN_JOB_ID" ]; then
            echo "No GitLab job is available, so no job log can be retrieved."
            echo "No GitLab job log is available." > gitlab-job.log
            cp gitlab-job.log gitlab-job-clean.log
            echo "log_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.jsc.fz-juelich.de/api/v4/projects/${ENCODED_PROJECT_PATH}/jobs/${MAIN_JOB_ID}/trace" \
            --output gitlab-job.log; then

            sed -r 's/\x1B\[[0-9;]*[mK]//g' gitlab-job.log > gitlab-job-clean.log

            echo "Main GitLab job log retrieved successfully."
            echo "log_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "The GitLab job log could not be retrieved."
            echo "The GitLab job log could not be retrieved." > gitlab-job.log
            cp gitlab-job.log gitlab-job-clean.log
            echo "log_available=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Main GitLab job log:"
          cat gitlab-job.log


      - name: Create GitLab CI summary
        if: always()
        env:
          PIPELINE_STATUS: ${{ steps.gitlab-result.outputs.pipeline_status }}
          PIPELINE_ID: ${{ steps.gitlab-pipeline.outputs.pipeline_id }}
          PIPELINE_URL: ${{ steps.gitlab-pipeline.outputs.pipeline_url }}
          JOB_COUNT: ${{ steps.gitlab-jobs.outputs.job_count }}
          MAIN_JOB_NAME: ${{ steps.gitlab-jobs.outputs.main_job_name }}
          MAIN_JOB_STATUS: ${{ steps.gitlab-jobs.outputs.main_job_status }}
          MAIN_JOB_STAGE: ${{ steps.gitlab-jobs.outputs.main_job_stage }}
          MAIN_JOB_DURATION: ${{ steps.gitlab-jobs.outputs.main_job_duration }}
          MAIN_JOB_URL: ${{ steps.gitlab-jobs.outputs.main_job_url }}
        run: |
          CI_BRANCH="ci/${GITHUB_SHA}"

          case "$PIPELINE_STATUS" in
            success)
              STATUS_DISPLAY="✅ Success"
              ;;
            failed)
              STATUS_DISPLAY="❌ Failed"
              ;;
            canceled)
              STATUS_DISPLAY="⚪ Canceled"
              ;;
            skipped)
              STATUS_DISPLAY="⏭️ Skipped"
              ;;
            timeout)
              STATUS_DISPLAY="⏳ Timeout"
              ;;
            *)
              STATUS_DISPLAY="❓ ${PIPELINE_STATUS:-Unknown}"
              ;;
          esac

          if [ -n "$MAIN_JOB_URL" ]; then
            JOB_LINK="[Open job](${MAIN_JOB_URL})"
          else
            JOB_LINK="Not available"
          fi

          if [ "$MAIN_JOB_DURATION" = "not_available" ] || [ -z "$MAIN_JOB_DURATION" ]; then
            DURATION_DISPLAY="Not available"
          else
            DURATION_DISPLAY="${MAIN_JOB_DURATION} seconds"
          fi

          {
            echo "## GitLab CI result"
            echo
            echo "**Status:** ${STATUS_DISPLAY}"
            echo
            echo "**GitHub commit SHA (commit ID):** \`${GITHUB_SHA}\`"
            echo
            echo "**GitLab branch:** \`${CI_BRANCH}\`"
            echo
            echo "**GitLab pipeline ID:** \`${PIPELINE_ID}\`"
            echo
            echo "**Pipeline:** [Open in GitLab](${PIPELINE_URL})"
            echo
            echo "### Jobs"
            echo
            echo "**Total jobs:** ${JOB_COUNT:-0}"
            echo
            echo "| Stage | Job | Status | Duration | Link |"
            echo "|---|---|---|---|---|"
            echo "| ${MAIN_JOB_STAGE:-Not available} | ${MAIN_JOB_NAME:-Not available} | ${MAIN_JOB_STATUS:-Not available} | ${DURATION_DISPLAY} | ${JOB_LINK} |"
            echo
            echo "### Main job log"
            echo
            echo '```text'
            cat gitlab-job-clean.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "GitLab CI summary created successfully."
          echo
          echo "Status: ${STATUS_DISPLAY}"
          echo "GitHub commit SHA (commit ID): ${GITHUB_SHA}"
          echo "GitLab branch: ${CI_BRANCH}"
          echo "GitLab pipeline ID: ${PIPELINE_ID}"
          echo "GitLab pipeline URL: ${PIPELINE_URL}"
          echo "Main job: ${MAIN_JOB_NAME:-Not available}"
          echo "Main job status: ${MAIN_JOB_STATUS:-Not available}"


      - name: Set final GitHub workflow status
        if: always()
        env:
          PIPELINE_STATUS: ${{ steps.gitlab-result.outputs.pipeline_status }}
        run: |
          echo "Final GitLab pipeline status: ${PIPELINE_STATUS}"

          if [ "$PIPELINE_STATUS" = "success" ]; then
            echo "GitLab pipeline succeeded. GitHub workflow is successful."
            exit 0
          fi

          echo "GitLab pipeline did not succeed. Marking GitHub workflow as failed."
          exit 1