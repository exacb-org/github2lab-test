name: GitHub to GitLab Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  send-to-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run ClusterHop
        uses: exacb-org/clusterhop@8243139a8b631b51e9363043c6320ce956d209dd
        with:
          gitlab-url: https://gitlab.jsc.fz-juelich.de
          gitlab-project: exacb/fahmin-experiments/githubci/github2lab-test-nonexistent-live-test-10-20261112
          jsc-machine: jureca
          secrets-file: .github/clusterhop/secrets.keyloom.yaml
        env:
          KEYLOOM_PASSWORD: ${{ secrets.KEYLOOM_PASSWORD }}
