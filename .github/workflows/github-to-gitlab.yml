name: GitHub to GitLab Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  send-to-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run ClusterHop
        uses: exacb-org/clusterhop@c41a9e1f4df396cd0f8ff46aa10410e02946ceed
        with:
          gitlab-url: https://gitlab.jsc.fz-juelich.de
          gitlab-project: exacb/fahmin-experiments/githubci/github2lab-test
          preset-machine: jureca
          secrets-file: .github/clusterhop/secrets.keyloom.yaml
        env:
          CLUSTERHOP_SECRETS_PASSWORD: ${{ secrets.CLUSTERHOP_SECRETS_PASSWORD }}
