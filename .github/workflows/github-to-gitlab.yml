name: GitHub to GitLab Test

on:
  push:
    branches:
      - main

jobs:
  send-to-gitlab:
    runs-on: ubuntu-latest
    steps:

      - name: Download GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download clusterhop
        uses: exacb-org/clusterhop@v6
        with:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REMOTE_URL: https://gitlab.jsc.fz-juelich.de/
          GITLAB_PROJECT_URI: exacb/example
          JSC_MACHINE: jupiter # It should set CLUSTERHOP_JUPITER_RUN==true before triggering GitLab CI
          JSC_MACHINE: jureca # It should set CLUSTERHOP_JURECA_RUN==true before triggering GitLab CI
          
