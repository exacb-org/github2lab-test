name: GitHub to GitLab Test

on:
  push:
    branches:
      - main

jobs:
  send-to-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install clusterhop
        run: >-
          python -m pip install
          "clusterhop @ git+https://github.com/exacb-org/clusterhop.git@fba640ca254fa12a665e87a6102a90d16e342ed1"

      - name: Run GitHub-to-GitLab bridge
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
          GITLAB_URL: https://gitlab.jsc.fz-juelich.de
          GITLAB_REMOTE_URL: https://gitlab.jsc.fz-juelich.de/exacb/fahmin-experiments/githubci/github2lab-test.git
        run: |
          python - <<'PY'
          from clusterhop.github2lab.runner import run_from_environment

          result = run_from_environment(repository_path=".")
          raise SystemExit(result.exit_code)
          PY
