name: GitHub to GitLab Test

on:
  push:
    branches:
      - main

jobs:
  send-to-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download clusterhop
        uses: actions/checkout@v6
        with:
          repository: exacb-org/clusterhop
          ref: 584bc3019354b2481e00ed50a0819b0a635fd862
          path: clusterhop
          token: ${{ secrets.CLUSTERHOP_READ_TOKEN }}

      - name: Install clusterhop
        run: python -m pip install ./clusterhop

      - name: Preflight GitLab remote access
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REMOTE_URL: https://gitlab.jsc.fz-juelich.de/exacb/fahmin-experiments/githubci/github2lab-test.git
        run: |
          if git -c credential.helper= \
            -c 'credential.helper=!f() { printf "%s\n" "username=oauth2" "password=$GITLAB_TOKEN"; }; f' \
            push --dry-run --push-option=ci.skip "$GITLAB_REMOTE_URL" \
            "HEAD:refs/heads/ci/${GITHUB_SHA}"; then
            echo "GitLab dry-run push succeeded."
          else
            echo "GitLab dry-run push failed."
            exit 1
          fi

      - name: Prepare ClusterHop runtime options
        run: |
          printf '%s\n' \
            "pipeline_state_file: $RUNNER_TEMP/github2lab-pipeline-state.json" \
            > "$RUNNER_TEMP/github2lab-options.yaml"

      - name: Run GitHub-to-GitLab bridge
        env:
          KEYLOOM_PASSWORD: ${{ secrets.KEYLOOM_PASSWORD }}
        run: |
          exec clusterhop run \
            --config .github/clusterhop/config.yaml \
            --options "$RUNNER_TEMP/github2lab-options.yaml" \
            . \
            --secrets .github/clusterhop/secrets.keyloom.yaml

      - name: Fallback GitLab cancellation
        if: ${{ cancelled() }}
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
          GITLAB_URL: https://gitlab.jsc.fz-juelich.de
          GITLAB_REMOTE_URL: https://gitlab.jsc.fz-juelich.de/exacb/fahmin-experiments/githubci/github2lab-test.git
          CLUSTERHOP_PIPELINE_STATE_FILE: ${{ runner.temp }}/github2lab-pipeline-state.json
        run: python -m clusterhop.github2lab.fallback
